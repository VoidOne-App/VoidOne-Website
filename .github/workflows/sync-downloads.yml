name: Sync VoidOne Downloads

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: voidone-release-index
  cancel-in-progress: true

jobs:
  validate:
    name: Validate GitHub release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate latest published release
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'User-Agent: VoidOne-Website-release-contract' 'https://api.github.com/repos/VoidOne-App/VoidOne/releases?per_page=20' -o /tmp/releases.json
          node <<'NODE'
          const releases = require('/tmp/releases.json');
          const release = releases.find(r => !r.draft);
          if (!release) throw new Error('No published VoidOne release found.');
          const assets = release.assets || [];
          const installer = assets.find(a => /\.(msi|exe)$/i.test(a.name) && a.state === 'uploaded');
          const portable = assets.find(a => /\.zip$/i.test(a.name) && a.state === 'uploaded');
          if (!installer || !portable) throw new Error('Release contract requires MSI/EXE installer and ZIP portable assets.');
          console.log('Release contract OK:', release.tag_name);
          console.log('Installer:', installer.name);
          console.log('Portable:', portable.name);
          NODE

      - name: Validate public manifest
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sSL -o /tmp/manifest-response -w '%{http_code}' --connect-timeout 10 --max-time 30 'https://voidone.dpdns.org/download/manifest.json')"

          if [[ "$status" == "200" ]]; then
            node -e "const m = require('/tmp/manifest-response'); if (m.schema !== 2) throw new Error('Expected manifest schema 2.'); if (!m.release?.version) throw new Error('Manifest missing release version.'); if (!m.platforms?.windows?.installer || !m.platforms?.windows?.portable) throw new Error('Manifest missing Windows assets.'); console.log('Manifest contract OK:', m.release.version);"
          elif [[ "$status" == "403" ]] && grep -Eqi 'cloudflare|just a moment|challenge' /tmp/manifest-response; then
            echo "::warning::Cloudflare challenged the GitHub Actions runner for the public manifest (HTTP 403). Runtime manifest shape is covered by tests/worker-download-contract.mjs in the deployment pipeline; public-edge validation was skipped."
          else
            echo "::error::Public manifest returned unexpected HTTP $status"
            head -c 1000 /tmp/manifest-response || true
            exit 1
          fi
