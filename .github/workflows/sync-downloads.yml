name: Sync VoidOne Downloads

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: voidone-download-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror release artifacts to Cloudflare R2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Sync latest published release to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOIDONE_R2_BUCKET: voidone-downloads
        run: node scripts/sync-downloads.mjs

      - name: Verify independent download manifest
        env:
          DOWNLOAD_MANIFEST_URL: https://voidone.dpdns.org/download/manifest.json
        run: |
          set -euo pipefail
          curl -fsSL "$DOWNLOAD_MANIFEST_URL" -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json'); if(!m.release?.version || !m.assets?.installer?.url || !m.assets?.portable?.url) process.exit(1); console.log('Download manifest:', m.release.version)"
