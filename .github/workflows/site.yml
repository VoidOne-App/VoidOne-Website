name: VoidOne Website CI

on:
  push:
    branches:
      - main
      - 'website-3.0/**'
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DIR: site
  VOIDONE_REPO: VoidOne-App/VoidOne
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate repository state
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SITE_DIR"
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f site/index.html
          test -f site/404.html
          test -f site/_headers
          test -f site/robots.txt
          test -f site/sitemap.xml
          echo "Repository: OK"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"

      - name: Validate required v3 surface
        shell: bash
        run: |
          set -euo pipefail
          required=(
            site/index.html
            site/404.html
            site/downloads/index.html
            site/platform/index.html
            site/developers/index.html
            site/project/index.html
            site/fa/index.html
            site/assets/icons/favicon.svg
            site/assets/icons/voidone-mark.svg
            site/css/core/base.css
            site/css/core/layout.css
            site/css/components/nav.css
            site/css/pages/home.css
            site/css/pages/downloads.css
            site/css/pages/platform.css
            site/css/pages/developers.css
            site/css/pages/project.css
            site/css/rtl.css
            site/js/core/site.js
            site/js/api/github.js
            site/js/components/downloads.js
            site/data/evolution.json
            site/data/project.json
            site/data/features.json
          )
          missing=()
          for file in "${required[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required file: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Required v3 files: OK"

  html:
    name: HTML / SEO / Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate documents
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.dir = None
                  self.title = False
                  self.description = False
                  self.viewport = False
                  self.canonical = False
                  self.main = 0
                  self.h1 = 0
                  self.images = []
                  self.links = []
                  self.inline_handlers = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == 'html':
                      self.lang, self.dir = attrs.get('lang'), attrs.get('dir')
                  elif tag == 'title':
                      self.title = True
                  elif tag == 'meta':
                      name = attrs.get('name', '').lower()
                      if name == 'description' and attrs.get('content', '').strip(): self.description = True
                      if name == 'viewport': self.viewport = True
                  elif tag == 'link' and attrs.get('rel', '').lower() == 'canonical':
                      self.canonical = bool(attrs.get('href'))
                  elif tag == 'main': self.main += 1
                  elif tag == 'h1': self.h1 += 1
                  elif tag == 'img': self.images.append(attrs)
                  elif tag == 'a': self.links.append(attrs)
                  for key in attrs:
                      if key.lower().startswith('on'):
                          self.inline_handlers.append(key)

          failures = []
          pages = sorted(Path('site').rglob('*.html'))
          for path in pages:
              p = Parser()
              p.feed(path.read_text(encoding='utf-8'))
              rel = path.as_posix()
              if not p.lang: failures.append(f'{rel}: missing html lang')
              if not p.title: failures.append(f'{rel}: missing title')
              if not p.description: failures.append(f'{rel}: missing meta description')
              if not p.viewport: failures.append(f'{rel}: missing viewport')
              if path.name != '404.html' and p.main != 1: failures.append(f'{rel}: expected exactly one main, found {p.main}')
              if path.name != '404.html' and p.h1 != 1: failures.append(f'{rel}: expected exactly one h1, found {p.h1}')
              if rel == 'site/fa/index.html' and (p.lang != 'fa' or p.dir != 'rtl'):
                  failures.append(f'{rel}: expected lang="fa" and dir="rtl"')
              for image in p.images:
                  if 'alt' not in image:
                      failures.append(f'{rel}: image missing alt attribute')
              for link in p.links:
                  if link.get('target') == '_blank' and 'noopener' not in link.get('rel', '').lower():
                      failures.append(f'{rel}: target="_blank" link missing rel="noopener"')
              if p.inline_handlers:
                  failures.append(f'{rel}: inline event handlers are not allowed')

          if failures:
              print('\n'.join('::error::' + x for x in failures))
              raise SystemExit(1)
          print(f'HTML contract: OK ({len(pages)} pages)')

      - name: Validate local links
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          root = Path('site').resolve()
          pattern = re.compile(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', re.I)
          ignored = ('http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:', '#', '/')
          failures = []

          for page in root.rglob('*.html'):
              for ref in pattern.findall(page.read_text(encoding='utf-8')):
                  ref = ref.split('#', 1)[0].split('?', 1)[0]
                  if not ref or ref.startswith(ignored):
                      continue
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      failures.append(f'{page.relative_to(root)} -> {ref}')

          if failures:
              print('::error::Broken local references:')
              print('\n'.join(sorted(set(failures))))
              raise SystemExit(1)
          print('Local links: OK')

  code:
    name: JavaScript / Data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=$(find site/js -type f -name '*.js' -print)
          test -n "$files"
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done <<< "$files"
          node --check src/worker.js
          if [[ -f scripts/sync-downloads.mjs ]]; then node --check scripts/sync-downloads.mjs; fi

      - name: Validate JSON data
        shell: python
        run: |
          import json
          from pathlib import Path
          required = {'evolution.json', 'project.json', 'features.json'}
          files = sorted(Path('site/data').glob('*.json'))
          if not files:
              raise SystemExit('::error::No site data files found')
          for path in files:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'::error::{path}: {exc}')
          missing = required - {p.name for p in files}
          if missing:
              raise SystemExit(f'::error::Missing data: {", ".join(sorted(missing))}')
          print(f'JSON contract: OK ({len(files)} files)')

      - name: Validate runtime wiring
        shell: python
        run: |
          from pathlib import Path
          home = Path('site/index.html').read_text(encoding='utf-8')
          downloads = Path('site/downloads/index.html').read_text(encoding='utf-8')
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          checks = {
              'shared runtime': 'js/core/site.js' in home,
              'GitHub API module': 'js/api/github.js' in home,
              'download component': 'js/components/downloads.js' in home or 'data-download=' in home,
              'repository': 'VoidOne-App/VoidOne' in api,
              'latest release': 'getLatestRelease' in api,
              'release asset URL': 'browser_download_url' in api,
              'download attributes': 'data-download' in component,
              'EXE target': 'data-download="exe"' in downloads,
              'ZIP target': 'data-download="zip"' in downloads,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('::error::Runtime contract failed: ' + ', '.join(bad))
          print('Runtime wiring: OK')

  security:
    name: Security / Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: preflight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate security headers
        shell: python
        run: |
          from pathlib import Path
          headers = Path('site/_headers').read_text(encoding='utf-8')
          required = {
              'X-Content-Type-Options:': 'nosniff',
              'Referrer-Policy:': 'strict-origin-when-cross-origin',
              'Permissions-Policy:': 'camera=(), microphone=(), geolocation=()',
              'Cross-Origin-Opener-Policy:': 'same-origin',
              'Cross-Origin-Resource-Policy:': 'same-origin',
              'Strict-Transport-Security:': 'max-age=31536000; includeSubDomains',
          }
          bad = [f'{k} {v}' for k, v in required.items() if k not in headers or v not in headers]
          if bad:
              raise SystemExit('::error::Security header contract failed:\n' + '\n'.join(bad))
          print('Security headers: OK')

      - name: Scan for obvious secret material
        shell: python
        run: |
          from pathlib import Path
          import re
          excluded = {'.git', '.wrangler', 'node_modules'}
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
          ]
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try: text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError): continue
              for pattern in patterns:
                  if pattern.search(text): failures.append(str(path))
          if failures:
              raise SystemExit('::error::Potential secret material found in: ' + ', '.join(sorted(set(failures))))
          print('Secret-pattern scan: OK')

      - name: Validate crawler metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s site/robots.txt
          test -s site/sitemap.xml
          grep -qi '<urlset' site/sitemap.xml
          echo 'robots.txt / sitemap.xml: OK'

  cloudflare:
    name: Cloudflare / Wrangler
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: preflight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate Wrangler configuration
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assets = config.get('assets', {})
          expected = {
              'name': 'voidone-website',
              'main': './src/worker.js',
              'compatibility_date': '2026-09-16',
          }
          bad = [f'{k}={config.get(k)!r}' for k,v in expected.items() if config.get(k) != v]
          if assets.get('directory') != './site': bad.append('assets.directory')
          if assets.get('binding') != 'ASSETS': bad.append('assets.binding')
          if '/download/*' not in assets.get('run_worker_first', []): bad.append('assets.run_worker_first')
          if config.get('workers_dev') is not True: bad.append('workers_dev')
          if config.get('preview_urls') is not False: bad.append('preview_urls')
          if bad: raise SystemExit('::error::Wrangler contract failed: ' + ', '.join(bad))
          print('Wrangler configuration: OK')

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts wrangler@${{ env.WRANGLER_VERSION }}

      - name: Dry-run Wrangler build
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir .wrangler-ci-dist
          test -d .wrangler-ci-dist
          echo 'Wrangler dry-run build: OK'

  integration:
    name: GitHub / Release Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [code, security]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check GitHub Releases API
        shell: bash
        env:
          API_URL: https://api.github.com/repos/${{ env.VOIDONE_REPO }}/releases?per_page=5
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL" > "$RUNNER_TEMP/releases.json"
          python - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if not isinstance(data, list): raise SystemExit('::error::GitHub Releases API returned a non-array response')
          published = [r for r in data if not r.get('draft')]
          print(f'GitHub Releases API: OK ({len(data)} releases returned, {len(published)} published)')
          PY

      - name: Validate release integration contract
        shell: python
        run: |
          from pathlib import Path
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          required = ['VoidOne-App/VoidOne', 'api.github.com/repos/', '/releases', 'browser_download_url']
          bad = [x for x in required if x not in api]
          if 'data-download' not in component: bad.append('data-download')
          if bad: raise SystemExit('::error::Release integration failed: ' + ', '.join(bad))
          print('Release integration: OK')

  summary:
    name: Final gate
    if: ${{ always() }}
    needs: [preflight, html, code, security, cloudflare, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish CI summary
        shell: bash
        run: |
          set -euo pipefail
          echo '## VoidOne Website CI' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Gate | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for entry in \
            'preflight:${{ needs.preflight.result }}' \
            'html:${{ needs.html.result }}' \
            'code:${{ needs.code.result }}' \
            'security:${{ needs.security.result }}' \
            'cloudflare:${{ needs.cloudflare.result }}' \
            'integration:${{ needs.integration.result }}'; do
            gate="${entry%%:*}"
            result="${entry#*:}"
            echo "| $gate | $result |" >> "$GITHUB_STEP_SUMMARY"
            [[ "$result" == success ]] || failed=1
          done
          if (( failed )); then
            echo '::error::One or more CI gates failed.'
            exit 1
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '✅ All Website 3.0 validation gates passed.' >> "$GITHUB_STEP_SUMMARY"
