name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.x'
  VOIDONE_REPO: 'VoidOne-App/VoidOne'
  SITE_DIR: 'site'

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate static site structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            site/index.html site/404.html site/downloads.html site/developers.html site/about.html site/faq.html
            site/_headers
            site/robots.txt site/sitemap.xml
            site/css/variables.css site/css/main.css site/css/responsive.css
            site/js/main.js site/js/github-api.js site/js/evolution.js
            site/data/evolution.json site/assets/icons/favicon.svg
            tests/release-api-contract.js tests/seo-contract.js tests/site-sync-contract.js
            wrangler.jsonc
          )
          missing=()
          for file in "${required[@]}"; do [[ -f "$file" ]] || missing+=("$file"); done
          if (( ${#missing[@]} )); then
            echo '::error::Missing required files:'
            printf '%s\n' "${missing[@]}"
            exit 1
          fi
          echo 'All required static-site files are present.'

      - name: Validate Cloudflare asset boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          if config.get('assets', {}).get('directory') != './site':
              print('::error::Wrangler assets.directory must be ./site'); sys.exit(1)
          if not config.get('workers_dev', False):
              print('::error::workers_dev must remain enabled for the current deployment'); sys.exit(1)
          if config.get('preview_urls') is not False:
              print('::error::preview_urls must be explicitly disabled'); sys.exit(1)
          print('Cloudflare asset boundary is locked to ./site.')
          PY

      - name: Validate local references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('site')
          missing = []
          pattern = re.compile(r'(?:href|src)=["\']([^"\'#?]+)')
          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              for ref in pattern.findall(text):
                  if ref.startswith(('http://','https://','mailto:','data:','#','/')): continue
                  if not (path.parent / ref).resolve().exists(): missing.append(f'{path}: {ref}')
          if missing:
              print('\n'.join(missing)); sys.exit(1)
          print('Local HTML references are valid.')
          PY

      - name: Validate HTML and SEO contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/seo-contract.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys
          class Contract(HTMLParser):
              def __init__(self):
                  super().__init__(); self.lang=None; self.title=False; self.viewport=False; self.main=0
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  if tag=='html': self.lang=attrs.get('lang')
                  elif tag=='title': self.title=True
                  elif tag=='meta' and attrs.get('name','').lower()=='viewport': self.viewport=True
                  elif tag=='main': self.main+=1
          failures=[]
          for path in sorted(Path('site').glob('*.html')):
              p=Contract(); p.feed(path.read_text(encoding='utf-8'))
              if not p.lang: failures.append(f'{path}: missing html lang')
              if not p.title: failures.append(f'{path}: missing title')
              if not p.viewport: failures.append(f'{path}: missing viewport')
              if path.name!='404.html' and p.main!=1: failures.append(f'{path}: expected one main')
          if failures: print('\n'.join(failures)); sys.exit(1)
          print('HTML document contract passed.')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find "$SITE_DIR/js" -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Validate JSON and security headers
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$SITE_DIR/data/evolution.json" >/dev/null
          python - <<'PY'
          from pathlib import Path
          import sys
          text=Path('site/_headers').read_text(encoding='utf-8')
          required={
            'X-Content-Type-Options:':'nosniff',
            'Referrer-Policy:':'strict-origin-when-cross-origin',
            'Permissions-Policy:':'camera=(), microphone=(), geolocation=()',
            'Cross-Origin-Opener-Policy:':'same-origin',
            'Cross-Origin-Resource-Policy:':'same-origin',
            'Strict-Transport-Security:':'max-age=31536000; includeSubDomains'
          }
          failures=[f'{k} {v}' for k,v in required.items() if k not in text or v not in text]
          if failures: print('\n'.join(failures)); sys.exit(1)
          print('JSON and security-header validation passed.')
          PY

      - name: Validate release integration
        shell: bash
        run: |
          set -euo pipefail
          node tests/release-api-contract.js
          node tests/site-sync-contract.js

      - name: Validate current release UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          text=Path('site/index.html').read_text(encoding='utf-8')+'\n'+Path('site/downloads.html').read_text(encoding='utf-8')
          required=['data-release-version','data-release-name','data-release-date','data-release-status','data-release-url','data-download="exe"','data-download="zip"']
          failures=[item for item in required if item not in text]
          if failures: print('\n'.join(failures)); sys.exit(1)
          if 'data-download="msi"' in text or 'MSI Package' in text: print('::error::Stale MSI release UI remains'); sys.exit(1)
          print('Current release UI contract passed.')
          PY

      - name: Smoke test GitHub Releases API
        shell: bash
        env:
          GH_API_URL: https://api.github.com/repos/${{ env.VOIDONE_REPO }}/releases?per_page=1
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/github-releases.json"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GH_API_URL" > "$response_file"
          python - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f: data=json.load(f)
          if not isinstance(data,list): raise SystemExit('GitHub Releases API did not return an array.')
          print(f'GitHub Releases API reachable; returned {len(data)} release(s).')
          if data: print(f"Latest API result: {data[0].get('tag_name','unknown')}")
          PY
