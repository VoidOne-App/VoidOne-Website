name: VoidOne Website CI

on:
  push:
    branches:
      - main
      - 'website-3.0/**'
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidone-website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DIR: site
  VOIDONE_REPO: VoidOne-App/VoidOne
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Repository state
        run: |
          set -euo pipefail
          test -d "$SITE_DIR"
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f site/index.html
          test -f site/404.html
          echo "Repository: OK"
          echo "Commit: $GITHUB_SHA"

      - name: Required structure
        run: |
          set -euo pipefail
          required=(
            site/index.html site/404.html site/downloads/index.html
            site/platform/index.html site/developers/index.html site/project/index.html
            site/fa/index.html site/_headers site/robots.txt site/sitemap.xml
            site/assets/icons/favicon.svg site/assets/icons/voidone-mark.svg
            site/css/core/base.css site/css/core/layout.css site/css/components/nav.css
            site/css/pages/home.css site/css/pages/downloads.css
            site/css/pages/platform.css site/css/pages/developers.css site/css/pages/project.css
            site/css/rtl.css site/js/core/site.js site/js/api/github.js
            site/js/components/downloads.js site/data/evolution.json
            site/data/project.json site/data/features.json src/worker.js wrangler.jsonc
          )
          missing=()
          for file in "${required[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required file: %s\n' "${missing[@]}"
            exit 1
          fi
          echo 'Required structure: OK'

      - name: Encoding and line endings
        shell: python
        run: |
          from pathlib import Path
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  data = path.read_bytes()
                  data.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if b'\r\n' in data:
                  failures.append(f'{path}: CRLF line endings')
          if failures:
              for item in failures:
                  print(f'::error::{item}')
              raise SystemExit(1)
          print('UTF-8 / LF policy: OK')

      - name: Configuration sanity
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assets = config.get('assets', {})
          checks = {
              'worker entrypoint': config.get('main') == './src/worker.js',
              'asset directory': assets.get('directory') == './site',
              'asset binding': assets.get('binding') == 'ASSETS',
              'download worker route': '/download/*' in assets.get('run_worker_first', []),
              'preview URLs disabled': config.get('preview_urls') is False,
              'workers dev disabled': config.get('workers_dev') is False,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('::error::Configuration sanity failed: ' + ', '.join(bad))
          print('Configuration sanity: OK')

  static_validation:
    name: Static Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: HTML, SEO and accessibility contracts
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.dir = None
                  self.title = False
                  self.description = False
                  self.viewport = False
                  self.main = 0
                  self.h1 = 0
                  self.images = []
                  self.links = []
                  self.inline_handlers = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == 'html':
                      self.lang, self.dir = attrs.get('lang'), attrs.get('dir')
                  elif tag == 'title':
                      self.title = True
                  elif tag == 'meta':
                      name = attrs.get('name', '').lower()
                      self.description |= name == 'description' and bool(attrs.get('content', '').strip())
                      self.viewport |= name == 'viewport'
                  elif tag == 'main':
                      self.main += 1
                  elif tag == 'h1':
                      self.h1 += 1
                  elif tag == 'img':
                      self.images.append(attrs)
                  elif tag == 'a':
                      self.links.append(attrs)
                  self.inline_handlers.extend(key for key in attrs if key.lower().startswith('on'))

          failures = []
          pages = sorted(Path('site').rglob('*.html'))
          for path in pages:
              parser = Parser()
              parser.feed(path.read_text(encoding='utf-8'))
              rel = path.as_posix()
              if not parser.lang: failures.append(f'{rel}: missing html lang')
              if not parser.title: failures.append(f'{rel}: missing title')
              if not parser.description: failures.append(f'{rel}: missing meta description')
              if not parser.viewport: failures.append(f'{rel}: missing viewport')
              if path.name != '404.html' and parser.main != 1: failures.append(f'{rel}: expected one main')
              if path.name != '404.html' and parser.h1 != 1: failures.append(f'{rel}: expected one h1')
              if rel == 'site/fa/index.html' and (parser.lang != 'fa' or parser.dir != 'rtl'):
                  failures.append(f'{rel}: expected lang="fa" dir="rtl"')
              for image in parser.images:
                  if 'alt' not in image: failures.append(f'{rel}: image missing alt')
              for link in parser.links:
                  if link.get('target') == '_blank' and 'noopener' not in link.get('rel', '').lower():
                      failures.append(f'{rel}: target=_blank missing rel=noopener')
              if parser.inline_handlers: failures.append(f'{rel}: inline event handlers are not allowed')
          if failures:
              print('\n'.join('::error::' + item for item in failures))
              raise SystemExit(1)
          print(f'HTML / SEO / Accessibility: OK ({len(pages)} pages)')

      - name: Internal links and static assets
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('site').resolve()
          patterns = {
              '.html': re.compile(r'''(?:href|src)\s*=\s*["']([^"'#?]+)''', re.I),
              '.css': re.compile(r'''url\(\s*["']?([^"')?#]+)''', re.I),
          }
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in patterns: continue
              for ref in patterns[path.suffix.lower()].findall(path.read_text(encoding='utf-8')):
                  if not ref or re.match(r'^[A-Za-z][A-Za-z0-9+.-]*:', ref) or ref.startswith('/'): continue
                  target = (path.parent / ref).resolve()
                  if not target.exists(): failures.append(f'{path.relative_to(root)} -> {ref}')
          if failures:
              print('::error::Broken local references:\n' + '\n'.join(sorted(set(failures))))
              raise SystemExit(1)
          print('Links / assets: OK')

      - name: Page consistency
        run: |
          set -euo pipefail
          for page in site/index.html site/downloads/index.html site/platform/index.html site/developers/index.html site/project/index.html site/fa/index.html; do
            grep -q '<header' "$page"
            grep -q '<footer' "$page"
          done
          echo 'Page consistency: OK'

  code_validation:
    name: Code Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: JavaScript and Worker syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site/js -type f -name '*.js' -print0)
          node --check src/worker.js
          [[ ! -f scripts/sync-downloads.mjs ]] || node --check scripts/sync-downloads.mjs
          echo 'JavaScript syntax: OK'

      - name: JSON validation and data contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          data_dir = Path('site/data')
          files = sorted(data_dir.glob('*.json'))
          for path in files: json.loads(path.read_text(encoding='utf-8'))
          required = {'evolution.json', 'project.json', 'features.json'}
          missing = required - {p.name for p in files}
          if missing: raise SystemExit('::error::Missing data files: ' + ', '.join(sorted(missing)))
          project = json.loads((data_dir / 'project.json').read_text(encoding='utf-8'))
          for key in ('name', 'tagline', 'description', 'status', 'license', 'repository', 'website'):
              if not str(project.get(key, '')).strip(): raise SystemExit(f'::error::project.json missing {key}')
          if not isinstance(json.loads((data_dir / 'evolution.json').read_text(encoding='utf-8')), list):
              raise SystemExit('::error::evolution.json must be an array')
          print(f'JSON / data contracts: OK ({len(files)} files)')

      - name: Runtime wiring
        shell: python
        run: |
          from pathlib import Path
          home = Path('site/index.html').read_text(encoding='utf-8')
          downloads = Path('site/downloads/index.html').read_text(encoding='utf-8')
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          checks = {
              'shared runtime': 'js/core/site.js' in home,
              'GitHub module': 'js/api/github.js' in home,
              'download module': 'js/components/downloads.js' in home,
              'repository': 'VoidOne-App/VoidOne' in api,
              'release discovery': 'getLatestRelease' in api,
              'asset URL': 'browser_download_url' in api,
              'MSI target': 'data-download="msi"' in downloads,
              'ZIP target': 'data-download="zip"' in downloads,
              'MSI handling': '.msi' in component,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad: raise SystemExit('::error::Runtime wiring failed: ' + ', '.join(bad))
          print('Runtime wiring: OK')

  security:
    name: Security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Security headers
        shell: python
        run: |
          from pathlib import Path
          headers = Path('site/_headers').read_text(encoding='utf-8')
          required = {
              'X-Content-Type-Options:': 'nosniff',
              'Referrer-Policy:': 'strict-origin-when-cross-origin',
              'Permissions-Policy:': 'camera=(), microphone=(), geolocation=()',
              'Cross-Origin-Opener-Policy:': 'same-origin',
              'Cross-Origin-Resource-Policy:': 'same-origin',
              'Strict-Transport-Security:': 'max-age=31536000; includeSubDomains',
          }
          bad = [f'{k} {v}' for k, v in required.items() if k not in headers or v not in headers]
          if bad: raise SystemExit('::error::Security header contract failed:\n' + '\n'.join(bad))
          print('Security headers: OK')

      - name: Dangerous references and secret scan
        shell: python
        run: |
          from pathlib import Path
          import re
          failures = []
          secret_patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
          ]
          for path in Path('site').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css', '.js'}: continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'<script[^>]+src=["\']http:', text, re.I): failures.append(f'{path}: insecure HTTP script')
              if re.search(r'<link[^>]+href=["\']http:', text, re.I): failures.append(f'{path}: insecure HTTP link')
              if re.search(r'javascript\s*:', text, re.I): failures.append(f'{path}: javascript: URL')
              if any(p.search(text) for p in secret_patterns): failures.append(f'{path}: potential secret')
          if failures: raise SystemExit('::error::Security policy failed:\n' + '\n'.join(failures))
          print('Security policy: OK')

  integration:
    name: Integration
    needs:
      - code_validation
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: VoidOne repository and releases API
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${VOIDONE_REPO}"
          headers=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "${headers[@]}" "$api" > /tmp/voidone.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 "${headers[@]}" "$api/releases?per_page=20" > /tmp/releases.json
          python - <<'PY'
          import json
          repo = json.load(open('/tmp/voidone.json', encoding='utf-8'))
          releases = json.load(open('/tmp/releases.json', encoding='utf-8'))
          if repo.get('full_name') != 'VoidOne-App/VoidOne':
              raise SystemExit('::error::Unexpected VoidOne repository response')
          release = next((r for r in releases if not r.get('draft')), None)
          if not release:
              raise SystemExit('::error::No non-draft VoidOne release found')
          assets = release.get('assets', [])
          installer = next((a for a in assets if a.get('name', '').lower().endswith('.msi')), None)
          portable = next((a for a in assets if a.get('name', '').lower().endswith('.zip') and not a.get('name', '').lower().endswith('.sha256')), None)
          if not installer or not portable:
              raise SystemExit(f'::error::Release {release.get("tag_name")} missing MSI or portable ZIP')
          json.dump(release, open('/tmp/latest-release.json', 'w', encoding='utf-8'))
          print(f'VoidOne release: {release["tag_name"]}')
          print(f'Installer: {installer["name"]}')
          print(f'Portable: {portable["name"]}')
          PY

      - name: Download abstraction
        shell: python
        run: |
          from pathlib import Path
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          page = Path('site/downloads/index.html').read_text(encoding='utf-8')
          checks = {
              'release helper': 'getReleaseAssetURL' in api,
              'release list discovery': 'releases?per_page=20' in api,
              'MSI asset': '.msi' in component,
              'ZIP asset': '.zip' in component,
              'installer target': 'data-installer' in page,
              'portable target': 'data-portable' in page,
              'API fallback': 'catch' in component,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad: raise SystemExit('::error::Download abstraction failed: ' + ', '.join(bad))
          print('Download abstraction: OK')

  deployment_validation:
    name: Deployment Validation
    needs:
      - static_validation
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-ci-dist

      - name: Workers Assets output
        run: |
          set -euo pipefail
          test -d .wrangler-ci-dist
          test -f .wrangler-ci-dist/_worker.js || test -f .wrangler-ci-dist/index.html
          echo 'Workers Assets dry-run output: OK'

      - name: Download route boundary
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          if '/download/*' not in config.get('assets', {}).get('run_worker_first', []):
              raise SystemExit('::error::Missing /download/* worker boundary')
          print('Download route boundary: OK')

  summary:
    name: CI Summary / Final Gate
    needs:
      - preflight
      - static_validation
      - code_validation
      - security
      - integration
      - deployment_validation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish summary and final gate
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          STATIC: ${{ needs.static_validation.result }}
          CODE: ${{ needs.code_validation.result }}
          SECURITY: ${{ needs.security.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DEPLOYMENT: ${{ needs.deployment_validation.result }}
        run: |
          {
            echo '# VoidOne Website CI'
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Preflight | $PREFLIGHT |"
            echo "| Static Validation | $STATIC |"
            echo "| Code Validation | $CODE |"
            echo "| Security | $SECURITY |"
            echo "| Integration | $INTEGRATION |"
            echo "| Deployment Validation | $DEPLOYMENT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREFLIGHT" == success && "$STATIC" == success && "$CODE" == success && "$SECURITY" == success && "$INTEGRATION" == success && "$DEPLOYMENT" == success ]]; then
            echo 'Final gate: PASSED'
          else
            echo 'Final gate: FAILED'
            exit 1
          fi
