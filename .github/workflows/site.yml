name: VoidOne Website CI

on:
  push:
    branches:
      - main
      - 'website-3.0/**'
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidone-website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DIR: site
  VOIDONE_REPO: VoidOne-App/VoidOne
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'

jobs:
  preflight:
    name: 🔍 Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Repository state
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SITE_DIR"
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f site/index.html
          test -f site/404.html
          echo "Repository: OK"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"

      - name: Required structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            site/index.html site/404.html site/downloads/index.html
            site/platform/index.html site/developers/index.html site/project/index.html
            site/fa/index.html site/_headers site/robots.txt site/sitemap.xml
            site/assets/icons/favicon.svg site/assets/icons/voidone-mark.svg
            site/css/core/base.css site/css/core/layout.css site/css/components/nav.css
            site/css/pages/home.css site/css/pages/downloads.css site/css/pages/platform.css
            site/css/pages/developers.css site/css/pages/project.css site/css/rtl.css
            site/js/core/site.js site/js/api/github.js site/js/components/downloads.js
            site/data/evolution.json site/data/project.json site/data/features.json
            src/worker.js wrangler.jsonc
          )
          missing=()
          for file in "${required[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required file: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Required structure: OK"

      - name: Encoding and line endings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  data = path.read_bytes()
                  data.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if b'\r\n' in data:
                  failures.append(f'{path}: CRLF line endings')
          if failures:
              for failure in failures:
                  print(f'::error::{failure}')
              raise SystemExit(1)
          print('UTF-8 / LF policy: OK')
          PY

      - name: Configuration sanity
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assets = config.get('assets', {})
          checks = {
              'worker entrypoint': config.get('main') == './src/worker.js',
              'asset directory': assets.get('directory') == './site',
              'asset binding': assets.get('binding') == 'ASSETS',
              'download worker route': '/download/*' in assets.get('run_worker_first', []),
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('::error::Configuration sanity failed: ' + ', '.join(bad))
          print('Configuration sanity: OK')

  static_validation:
    name: 🧱 Static Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: HTML validity, SEO and accessibility contracts
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = self.dir = None
                  self.title = self.description = self.viewport = False
                  self.main = self.h1 = 0
                  self.images = []
                  self.links = []
                  self.inline_handlers = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs); tag = tag.lower()
                  if tag == 'html': self.lang, self.dir = attrs.get('lang'), attrs.get('dir')
                  elif tag == 'title': self.title = True
                  elif tag == 'meta':
                      name = attrs.get('name', '').lower()
                      if name == 'description' and attrs.get('content', '').strip(): self.description = True
                      if name == 'viewport': self.viewport = True
                  elif tag == 'main': self.main += 1
                  elif tag == 'h1': self.h1 += 1
                  elif tag == 'img': self.images.append(attrs)
                  elif tag == 'a': self.links.append(attrs)
                  self.inline_handlers.extend(k for k in attrs if k.lower().startswith('on'))

          failures = []
          pages = sorted(Path('site').rglob('*.html'))
          if not pages: failures.append('No HTML pages found')
          for path in pages:
              p = Parser(); p.feed(path.read_text(encoding='utf-8')); rel = path.as_posix()
              if not p.lang: failures.append(f'{rel}: missing html lang')
              if not p.title: failures.append(f'{rel}: missing title')
              if not p.description: failures.append(f'{rel}: missing meta description')
              if not p.viewport: failures.append(f'{rel}: missing viewport')
              if path.name != '404.html' and p.main != 1: failures.append(f'{rel}: expected one main, found {p.main}')
              if path.name != '404.html' and p.h1 != 1: failures.append(f'{rel}: expected one h1, found {p.h1}')
              if rel == 'site/fa/index.html' and (p.lang != 'fa' or p.dir != 'rtl'):
                  failures.append(f'{rel}: expected lang="fa" dir="rtl"')
              for image in p.images:
                  if 'alt' not in image: failures.append(f'{rel}: image missing alt')
              for link in p.links:
                  if link.get('target') == '_blank' and 'noopener' not in link.get('rel', '').lower():
                      failures.append(f'{rel}: target=_blank missing rel=noopener')
              if p.inline_handlers: failures.append(f'{rel}: inline event handlers are not allowed')

          if failures:
              print('\n'.join('::error::' + x for x in failures)); raise SystemExit(1)
          print(f'HTML / SEO / Accessibility: OK ({len(pages)} pages)')

      - name: Internal links and static assets
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('site').resolve()
          patterns = [re.compile(r'''(?:href|src)\s*=\s*["']([^"'#?]+)''', re.I), re.compile(r'''url\(\s*["']?([^"')?#]+)''', re.I)]
          ignored = ('http://','https://','mailto:','tel:','data:','javascript:','#','/')
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.css','.js'}: continue
              text = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  for ref in pattern.findall(text):
                      if not ref or ref.startswith(ignored) or ref.startswith(('var(','env(')): continue
                      target = (path.parent / ref.split('#',1)[0].split('?',1)[0]).resolve()
                      if not target.exists(): failures.append(f'{path.relative_to(root)} -> {ref}')
          if failures:
              print('::error::Broken local references:\n' + '\n'.join(sorted(set(failures))))
              raise SystemExit(1)
          print('Links / assets: OK')

      - name: Page consistency
        shell: bash
        run: |
          set -euo pipefail
          for page in site/index.html site/downloads/index.html site/platform/index.html site/developers/index.html site/project/index.html site/fa/index.html; do
            grep -q '<header' "$page"
            grep -q '<footer' "$page"
          done
          echo 'Page consistency: OK'

  code_validation:
    name: ⚙️ Code Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: JavaScript and Worker syntax
        shell: bash
        run: |
          set -euo pipefail
          find site/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check src/worker.js
          [[ ! -f scripts/sync-downloads.mjs ]] || node --check scripts/sync-downloads.mjs
          echo 'JavaScript syntax: OK'

      - name: JSON validation and data contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          required = {'evolution.json','project.json','features.json'}
          files = sorted(Path('site/data').glob('*.json'))
          for path in files: json.loads(path.read_text(encoding='utf-8'))
          missing = required - {p.name for p in files}
          if missing: raise SystemExit('::error::Missing data files: ' + ', '.join(sorted(missing)))
          project = json.loads(Path('site/data/project.json').read_text(encoding='utf-8'))
          for key in ('name','tagline','description','status','license','repository','website'):
              if not str(project.get(key, '')).strip(): raise SystemExit(f'::error::project.json missing {key}')
          evolution = json.loads(Path('site/data/evolution.json').read_text(encoding='utf-8'))
          if not isinstance(evolution, list): raise SystemExit('::error::evolution.json must be an array')
          print(f'JSON / data contracts: OK ({len(files)} files)')

      - name: Runtime wiring
        shell: python
        run: |
          from pathlib import Path
          home = Path('site/index.html').read_text(encoding='utf-8')
          downloads = Path('site/downloads/index.html').read_text(encoding='utf-8')
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          checks = {
              'shared runtime': 'js/core/site.js' in home,
              'GitHub module': 'js/api/github.js' in home,
              'download module': 'js/components/downloads.js' in home,
              'repository': 'VoidOne-App/VoidOne' in api,
              'latest release': 'getLatestRelease' in api,
              'asset URL': 'browser_download_url' in api,
              'download contract': 'data-download' in component,
              'EXE target': 'data-download="exe"' in downloads,
              'ZIP target': 'data-download="zip"' in downloads,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad: raise SystemExit('::error::Runtime wiring failed: ' + ', '.join(bad))
          print('Runtime wiring: OK')

  security:
    name: 🔐 Security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Security headers
        shell: python
        run: |
          from pathlib import Path
          headers = Path('site/_headers').read_text(encoding='utf-8')
          required = {
              'X-Content-Type-Options:':'nosniff',
              'Referrer-Policy:':'strict-origin-when-cross-origin',
              'Permissions-Policy:':'camera=(), microphone=(), geolocation=()',
              'Cross-Origin-Opener-Policy:':'same-origin',
              'Cross-Origin-Resource-Policy:':'same-origin',
              'Strict-Transport-Security:':'max-age=31536000; includeSubDomains',
          }
          bad = [f'{k} {v}' for k,v in required.items() if k not in headers or v not in headers]
          if bad: raise SystemExit('::error::Security header contract failed:\n' + '\n'.join(bad))
          print('Security headers: OK')

      - name: Dangerous reference and external-resource policy
        shell: python
        run: |
          from pathlib import Path
          import re
          failures=[]
          for path in Path('site').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.css','.js'}: continue
              text=path.read_text(encoding='utf-8')
              if re.search(r'<script[^>]+src=["\']http:', text, re.I): failures.append(f'{path}: insecure HTTP script')
              if re.search(r'<link[^>]+href=["\']http:', text, re.I): failures.append(f'{path}: insecure HTTP stylesheet/link')
              if re.search(r'javascript\s*:', text, re.I): failures.append(f'{path}: javascript: URL')
          if failures: raise SystemExit('::error::Security policy failed:\n'+'\n'.join(failures))
          print('Dangerous references / external policy: OK')

      - name: Secret-pattern scan
        shell: python
        run: |
          from pathlib import Path
          import re
          excluded={'.git','.wrangler','node_modules'}
          patterns=[
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
          ]
          failures=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(p in excluded for p in path.parts): continue
              try: text=path.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if any(pattern.search(text) for pattern in patterns): failures.append(str(path))
          if failures: raise SystemExit('::error::Potential secret material: '+', '.join(sorted(set(failures))))
          print('Secret-pattern scan: OK')

      - name: Unsafe configuration sanity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'permissions:' .github/workflows/site.yml
          grep -q 'contents: read' .github/workflows/site.yml
          grep -q "preview_urls: false" wrangler.jsonc
          echo 'Unsafe configuration sanity: OK'

  integration:
    name: 🔗 Integration
    needs: [code_validation, security]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: VoidOne repository reachability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${VOIDONE_REPO}" > "$RUNNER_TEMP/repository.json"
          python - "$RUNNER_TEMP/repository.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('full_name') != 'VoidOne-App/VoidOne': raise SystemExit('::error::Unexpected repository identity')
          print('VoidOne repository: OK')
          PY

      - name: Releases API and release assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${VOIDONE_REPO}/releases?per_page=10" > "$RUNNER_TEMP/releases.json"
          python - "$RUNNER_TEMP/releases.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if not isinstance(data,list): raise SystemExit('::error::Releases API returned a non-array response')
          published=[r for r in data if not r.get('draft') and not r.get('prerelease')]
          print(f'Releases API: OK ({len(data)} returned, {len(published)} stable published)')
          if published:
              assets=published[0].get('assets',[])
              names=[a.get('name','') for a in assets]
              print('Latest stable release:', published[0].get('tag_name','unknown'))
              print('Assets:', ', '.join(names) if names else '(none)')
          PY

      - name: Download abstraction contract
        shell: python
        run: |
          from pathlib import Path
          api=Path('site/js/api/github.js').read_text(encoding='utf-8')
          component=Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          required=['VoidOne-App/VoidOne','api.github.com/repos/','/releases','browser_download_url']
          bad=[x for x in required if x not in api]
          if 'data-download' not in component: bad.append('data-download')
          if bad: raise SystemExit('::error::Download integration failed: '+', '.join(bad))
          print('Download abstraction: OK')

      - name: API failure-handling contract
        shell: python
        run: |
          from pathlib import Path
          text=Path('site/js/api/github.js').read_text(encoding='utf-8')
          markers=('catch','throw','response.ok','finally')
          if not any(marker in text for marker in markers):
              raise SystemExit('::error::GitHub API module has no visible failure-handling path')
          print('API failure handling: OK')

  deployment_validation:
    name: ☁️ Deployment Validation
    needs: [static_validation, code_validation, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Wrangler configuration
        shell: python
        run: |
          import json
          from pathlib import Path
          c=json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8')); a=c.get('assets',{})
          checks={
              'name':c.get('name')=='voidone-website',
              'main':c.get('main')=='./src/worker.js',
              'assets.directory':a.get('directory')=='./site',
              'assets.binding':a.get('binding')=='ASSETS',
              'download route': '/download/*' in a.get('run_worker_first',[]),
              'workers_dev':c.get('workers_dev') is True,
              'preview_urls':c.get('preview_urls') is False,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('::error::Wrangler contract failed: '+', '.join(bad))
          print('Wrangler configuration: OK')

      - name: Install pinned Wrangler
        run: npm install --no-save --ignore-scripts wrangler@${{ env.WRANGLER_VERSION }}

      - name: Workers Assets and routing dry-run
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --dry-run --outdir .wrangler-ci-dist
          test -d .wrangler-ci-dist
          test -f .wrangler-ci-dist/worker.js || find .wrangler-ci-dist -maxdepth 2 -type f -print
          echo 'Workers Assets / routing dry-run: OK'

      - name: Download route boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"/download/\*"' wrangler.jsonc
          grep -R -q 'download' src/worker.js
          echo '/download/* routing boundary: OK'

  summary:
    name: 📊 CI Summary / Final Gate
    if: ${{ always() }}
    needs: [preflight, static_validation, code_validation, security, integration, deployment_validation]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          echo '# VoidOne Website CI' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Gate | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for entry in \
            'preflight:${{ needs.preflight.result }}' \
            'static-validation:${{ needs.static_validation.result }}' \
            'code-validation:${{ needs.code_validation.result }}' \
            'security:${{ needs.security.result }}' \
            'integration:${{ needs.integration.result }}' \
            'deployment-validation:${{ needs.deployment_validation.result }}'; do
            gate="${entry%%:*}"; result="${entry#*:}"
            case "$result" in
              success) icon='✅' ;;
              skipped) icon='⏭️' ;;
              cancelled) icon='🚫' ;;
              *) icon='❌'; failed=1 ;;
            esac
            echo "| $icon $gate | $result |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if (( failed )); then
            echo '## ❌ Final Gate: FAILED' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::VoidOne Website CI failed one or more quality gates.'
            exit 1
          fi
          echo '## ✅ Final Gate: PASSED' >> "$GITHUB_STEP_SUMMARY"
          echo 'All Website 3.0 quality gates passed.' >> "$GITHUB_STEP_SUMMARY"
