name: VoidOne Website CI

on:
  push:
    branches:
      - main
      - 'website-3.0/**'
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'scripts/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidone-website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DIR: site
  VOIDONE_REPO: VoidOne-App/VoidOne
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Repository state
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SITE_DIR"
          test -f src/worker.js
          test -f wrangler.jsonc
          test -f site/index.html
          test -f site/404.html
          echo "Repository: OK"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
      - name: Required structure
        shell: bash
        run: |
          set -euo pipefail
          required=(
            site/index.html
            site/404.html
            site/downloads/index.html
            site/platform/index.html
            site/developers/index.html
            site/project/index.html
            site/fa/index.html
            site/_headers
            site/robots.txt
            site/sitemap.xml
            site/assets/icons/favicon.svg
            site/assets/icons/voidone-mark.svg
            site/css/core/base.css
            site/css/core/layout.css
            site/css/components/nav.css
            site/css/pages/home.css
            site/css/pages/downloads.css
            site/css/pages/platform.css
            site/css/pages/developers.css
            site/css/pages/project.css
            site/css/rtl.css
            site/js/core/site.js
            site/js/api/github.js
            site/js/components/downloads.js
            site/data/evolution.json
            site/data/project.json
            site/data/features.json
            src/worker.js
            wrangler.jsonc
          )
          missing=()
          for file in "${required[@]}"; do
            [[ -f "$file" ]] || missing+=("$file")
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required file: %s\n' "${missing[@]}"
            exit 1
          fi
          echo 'Required structure: OK'
      - name: Encoding and line endings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  data = path.read_bytes()
                  data.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if b'\r\n' in data:
                  failures.append(f'{path}: CRLF line endings')
          if failures:
              print('\n'.join('::error::' + item for item in failures))
              raise SystemExit(1)
          print('UTF-8 / LF policy: OK')
          PY
      - name: Configuration sanity
        shell: python
        run: |
          import json
          from pathlib import Path
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assets = config.get('assets', {})
          checks = {
              'worker entrypoint': config.get('main') == './src/worker.js',
              'asset directory': assets.get('directory') == './site',
              'asset binding': assets.get('binding') == 'ASSETS',
              'download worker route': '/download/*' in assets.get('run_worker_first', []),
          }
          bad = [key for key, value in checks.items() if not value]
          if bad:
              raise SystemExit('::error::Configuration sanity failed: ' + ', '.join(bad))
          print('Configuration sanity: OK')

  static_validation:
    name: Static Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: HTML, SEO and accessibility contracts
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.lang = None
                  self.dir = None
                  self.title = False
                  self.description = False
                  self.viewport = False
                  self.main = 0
                  self.h1 = 0
                  self.images = []
                  self.links = []
                  self.inline_handlers = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == 'html':
                      self.lang = attrs.get('lang')
                      self.dir = attrs.get('dir')
                  elif tag == 'title':
                      self.title = True
                  elif tag == 'meta':
                      name = attrs.get('name', '').lower()
                      if name == 'description' and attrs.get('content', '').strip():
                          self.description = True
                      if name == 'viewport':
                          self.viewport = True
                  elif tag == 'main':
                      self.main += 1
                  elif tag == 'h1':
                      self.h1 += 1
                  elif tag == 'img':
                      self.images.append(attrs)
                  elif tag == 'a':
                      self.links.append(attrs)
                  self.inline_handlers.extend(key for key in attrs if key.lower().startswith('on'))

          failures = []
          pages = sorted(Path('site').rglob('*.html'))
          for path in pages:
              parser = Parser()
              parser.feed(path.read_text(encoding='utf-8'))
              rel = path.as_posix()
              if not parser.lang:
                  failures.append(f'{rel}: missing html lang')
              if not parser.title:
                  failures.append(f'{rel}: missing title')
              if not parser.description:
                  failures.append(f'{rel}: missing meta description')
              if not parser.viewport:
                  failures.append(f'{rel}: missing viewport')
              if path.name != '404.html' and parser.main != 1:
                  failures.append(f'{rel}: expected one main')
              if path.name != '404.html' and parser.h1 != 1:
                  failures.append(f'{rel}: expected one h1')
              if rel == 'site/fa/index.html' and (parser.lang != 'fa' or parser.dir != 'rtl'):
                  failures.append(f'{rel}: expected lang="fa" dir="rtl"')
              for image in parser.images:
                  if 'alt' not in image:
                      failures.append(f'{rel}: image missing alt')
              for link in parser.links:
                  if link.get('target') == '_blank' and 'noopener' not in link.get('rel', '').lower():
                      failures.append(f'{rel}: target=_blank missing rel=noopener')
              if parser.inline_handlers:
                  failures.append(f'{rel}: inline event handlers are not allowed')

          if failures:
              print('\n'.join('::error::' + item for item in failures))
              raise SystemExit(1)
          print(f'HTML / SEO / Accessibility: OK ({len(pages)} pages)')
      - name: Internal links and static assets
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('site').resolve()
          patterns = {
              '.html': re.compile(r'''(?:href|src)\s*=\s*["']([^"'#?]+)''', re.I),
              '.css': re.compile(r'''url\(\s*["']?([^"')?#]+)''', re.I),
          }
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in patterns:
                  continue
              for ref in patterns[path.suffix.lower()].findall(path.read_text(encoding='utf-8')):
                  if not ref or re.match(r'^[A-Za-z][A-Za-z0-9+.-]*:', ref) or ref.startswith('/'):
                      continue
                  if not (path.parent / ref).resolve().exists():
                      failures.append(f'{path.relative_to(root)} -> {ref}')
          if failures:
              print('::error::Broken local references:\n' + '\n'.join(sorted(set(failures))))
              raise SystemExit(1)
          print('Links / assets: OK')
      - name: Page consistency
        shell: bash
        run: |
          set -euo pipefail
          for page in site/index.html site/downloads/index.html site/platform/index.html site/developers/index.html site/project/index.html site/fa/index.html; do
            grep -q '<header' "$page"
            grep -q '<footer' "$page"
          done
          echo 'Page consistency: OK'

  code_validation:
    name: Code Validation
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript and Worker syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site/js -type f -name '*.js' -print0)
          node --check src/worker.js
          node --check site/sw.js
          if [[ -f scripts/sync-downloads.mjs ]]; then
            node --check scripts/sync-downloads.mjs
          fi
          echo 'JavaScript syntax: OK'
      - name: Command deck contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/deck-contract.js
          echo 'Command deck contracts: OK'
      - name: JSON validation and data contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          data_dir = Path('site/data')
          files = sorted(data_dir.glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          required = {'evolution.json', 'project.json', 'features.json'}
          missing = required - {path.name for path in files}
          if missing:
              raise SystemExit('::error::Missing data files: ' + ', '.join(sorted(missing)))
          project = json.loads((data_dir / 'project.json').read_text(encoding='utf-8'))
          for key in ('name', 'tagline', 'description', 'status', 'license', 'repository', 'website'):
              if not str(project.get(key, '')).strip():
                  raise SystemExit(f'::error::project.json missing {key}')
          evolution = json.loads((data_dir / 'evolution.json').read_text(encoding='utf-8'))
          if not isinstance(evolution, list):
              raise SystemExit('::error::evolution.json must be an array')
          print(f'JSON / data contracts: OK ({len(files)} files)')
      - name: Runtime wiring
        shell: python
        run: |
          from pathlib import Path
          home = Path('site/index.html').read_text(encoding='utf-8')
          downloads = Path('site/downloads/index.html').read_text(encoding='utf-8')
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          checks = {
              'shared runtime': 'js/core/site.js' in home,
              'GitHub module': 'js/api/github.js' in home,
              'download module': 'js/components/downloads.js' in home,
              'repository': 'VoidOne-App/VoidOne' in api,
              'latest release': 'getLatestRelease' in api,
              'asset URL': 'browser_download_url' in api,
              'download contract': 'data-download' in component,
              'installer target': 'data-installer' in downloads,
              'ZIP target': 'data-download="zip"' in downloads,
          }
          bad = [key for key, value in checks.items() if not value]
          if bad:
              raise SystemExit('::error::Runtime wiring failed: ' + ', '.join(bad))
          print('Runtime wiring: OK')

  security:
    name: Security
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Security headers
        shell: python
        run: |
          from pathlib import Path
          headers = Path('site/_headers').read_text(encoding='utf-8')
          required = {
              'X-Content-Type-Options:': 'nosniff',
              'Referrer-Policy:': 'strict-origin-when-cross-origin',
              'Permissions-Policy:': 'camera=(), microphone=(), geolocation=()',
              'Cross-Origin-Opener-Policy:': 'same-origin',
              'Cross-Origin-Resource-Policy:': 'same-origin',
              'Strict-Transport-Security:': 'max-age=31536000; includeSubDomains',
          }
          bad = [f'{key} {value}' for key, value in required.items() if key not in headers or value not in headers]
          if bad:
              raise SystemExit('::error::Security header contract failed:\n' + '\n'.join(bad))
          print('Security headers: OK')
      - name: Dangerous reference and external-resource policy
        shell: python
        run: |
          from pathlib import Path
          import re
          failures = []
          for path in Path('site').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8')
              if re.search(r'<script[^>]+src=["\']http:', text, re.I):
                  failures.append(f'{path}: insecure HTTP script')
              if re.search(r'<link[^>]+href=["\']http:', text, re.I):
                  failures.append(f'{path}: insecure HTTP stylesheet/link')
              if re.search(r'javascript\s*:', text, re.I):
                  failures.append(f'{path}: javascript: URL')
          if failures:
              raise SystemExit('::error::Security policy failed:\n' + '\n'.join(failures))
          print('Dangerous references / external policy: OK')
      - name: Secret-pattern scan
        shell: python
        run: |
          from pathlib import Path
          import re
          excluded = {'.git', '.wrangler', 'node_modules'}
          patterns = [
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'ghp_[A-Za-z0-9]{30,}'),
              re.compile(r'github_pat_[A-Za-z0-9_]{30,}'),
          ]
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  failures.append(str(path))
          if failures:
              raise SystemExit('::error::Potential secret material: ' + ', '.join(sorted(set(failures))))
          print('Secret-pattern scan: OK')
      - name: Unsafe configuration sanity
        shell: python
        run: |
          import json
          from pathlib import Path
          workflow = Path('.github/workflows/site.yml').read_text(encoding='utf-8')
          config = json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assets = config.get('assets', {})
          checks = {
              'workflow permissions': 'permissions:\n  contents: read' in workflow,
              'preview URLs disabled': config.get('preview_urls') is False,
              'workers dev disabled': config.get('workers_dev') is False,
              'download route configured': '/download/*' in assets.get('run_worker_first', []),
          }
          bad = [key for key, value in checks.items() if not value]
          if bad:
              raise SystemExit('::error::Unsafe configuration sanity failed: ' + ', '.join(bad))
          print('Unsafe configuration sanity: OK')

  integration:
    name: Integration
    needs:
      - code_validation
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: VoidOne repository reachability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${VOIDONE_REPO}" > /tmp/voidone.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/voidone.json', encoding='utf-8'))
          if data.get('full_name') != 'VoidOne-App/VoidOne':
              raise SystemExit('::error::Unexpected repository response')
          print('VoidOne repository: reachable')
          PY
      - name: GitHub Releases API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${VOIDONE_REPO}/releases?per_page=20" > /tmp/releases.json
          python - <<'PY'
          import json
          releases = json.load(open('/tmp/releases.json', encoding='utf-8'))
          release = next((item for item in releases if not item.get('draft')), None)
          if not release:
              raise SystemExit('::error::No published VoidOne release found')
          assets = {asset.get('name', '') for asset in release.get('assets', [])}
          installer = next((name for name in assets if name.lower().endswith(('.msi', '.exe'))), None)
          portable = next((name for name in assets if name.lower().endswith('.zip')), None)
          if not installer:
              raise SystemExit('::error::Published release has no MSI/EXE installer asset')
          if not portable:
              raise SystemExit('::error::Published release has no ZIP portable asset')
          print(f"Release: {release.get('tag_name')}")
          print(f"Installer: {installer}")
          print(f"Portable: {portable}")
          PY
      - name: Download abstraction wiring
        shell: python
        run: |
          from pathlib import Path
          api = Path('site/js/api/github.js').read_text(encoding='utf-8')
          component = Path('site/js/components/downloads.js').read_text(encoding='utf-8')
          downloads = Path('site/downloads/index.html').read_text(encoding='utf-8')
          checks = {
              'release list endpoint': 'releases?per_page=20' in api,
              'asset browser URL': 'browser_download_url' in api,
              'installer UI': 'data-installer' in downloads,
              'portable UI': 'data-portable' in downloads or 'data-download="zip"' in downloads,
              'download component': 'getReleaseAsset' in component,
          }
          bad = [key for key, value in checks.items() if not value]
          if bad:
              raise SystemExit('::error::Download abstraction failed: ' + ', '.join(bad))
          print('Download abstraction: OK')
      - name: API failure handling
        shell: bash
        run: |
          set -euo pipefail
          grep -q "catch" site/js/components/downloads.js
          grep -q "Open GitHub Releases\|VIEW RELEASES\|Release unavailable" site/js/components/downloads.js
          echo 'API failure handling: OK'

  deployment_validation:
    name: Deployment Validation
    needs:
      - static_validation
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"
      - name: Validate Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir .wrangler-ci-dist
      - name: Workers Assets dry-run output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .wrangler-ci-dist ]]; then
            echo 'Workers Assets dry-run directory present.'
            find .wrangler-ci-dist -maxdepth 2 -type f -print | head -50 || true
          else
            echo 'Workers Assets dry-run completed without materialized output (expected for dry-run).'
          fi
          echo 'Workers Assets dry-run output: OK'
      - name: Download route boundary
        shell: python
        run: |
          from pathlib import Path
          worker = Path('src/worker.js').read_text(encoding='utf-8')
          config = Path('wrangler.jsonc').read_text(encoding='utf-8')
          if '/download/' not in worker and '/download/*' not in config:
              raise SystemExit('::error::Download route boundary is not declared')
          print('Download route boundary: OK')

  summary:
    name: CI Summary
    needs:
      - preflight
      - static_validation
      - code_validation
      - security
      - integration
      - deployment_validation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final gate
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          STATIC: ${{ needs.static_validation.result }}
          CODE: ${{ needs.code_validation.result }}
          SECURITY: ${{ needs.security.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DEPLOYMENT: ${{ needs.deployment_validation.result }}
        run: |
          set -euo pipefail
          echo "## VoidOne Website CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Preflight | $PREFLIGHT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static Validation | $STATIC |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Validation | $CODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | $SECURITY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration | $INTEGRATION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deployment Validation | $DEPLOYMENT |" >> "$GITHUB_STEP_SUMMARY"
          for result in "$PREFLIGHT" "$STATIC" "$CODE" "$SECURITY" "$INTEGRATION" "$DEPLOYMENT"; do
            if [[ "$result" != 'success' ]]; then
              echo '::error::VoidOne Website CI final gate failed.'
              exit 1
            fi
          done
          echo 'VoidOne Website CI final gate: PASSED' >> "$GITHUB_STEP_SUMMARY"
