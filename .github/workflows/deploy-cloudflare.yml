name: Deploy Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate static site boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            wrangler.jsonc src/worker.js
            site/index.html site/404.html site/downloads.html site/developers.html site/about.html site/faq.html
            site/fa/index.html site/fa/404.html site/fa/downloads.html site/fa/developers.html site/fa/about.html site/fa/faq.html
            site/_headers site/robots.txt site/sitemap.xml
            site/css/variables.css site/css/main.css site/css/responsive.css site/css/rtl.css
            site/js/main.js site/js/github-api.js site/js/downloads.js site/js/evolution.js
            site/data/evolution.json site/assets/icons/favicon.svg site/assets/icons/voidone-mark.svg
            scripts/sync-downloads.mjs
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "::error::Missing required deployment file: $file"; exit 1; }
          done

      - name: Verify Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "voidone-website"' wrangler.jsonc
          grep -q '"main": "./src/worker.js"' wrangler.jsonc
          grep -q '"directory": "./site"' wrangler.jsonc
          grep -q '"binding": "ASSETS"' wrangler.jsonc
          grep -q '"binding": "VOIDONE_DOWNLOADS"' wrangler.jsonc
          grep -q '"bucket_name": "voidone-downloads"' wrangler.jsonc
          grep -q '"compatibility_date": "2026-09-16"' wrangler.jsonc

      - name: Verify current site sync
        shell: bash
        run: |
          set -euo pipefail
          node tests/site-sync-contract.js
          node tests/seo-contract.js

      - name: Deploy site and download worker with pinned Wrangler
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm exec --yes --package=wrangler@4.129.0 -- \
            wrangler deploy --config ./wrangler.jsonc
