name: Deploy Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'
  WORKER_CONFIG: './wrangler.jsonc'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Repository and deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "${WORKER_CONFIG}"
            "src/worker.js"
            "site/index.html"
            "site/404.html"
            "site/downloads/index.html"
            "site/platform/index.html"
            "site/developers/index.html"
            "site/project/index.html"
            "site/fa/index.html"
            "site/_headers"
            "site/robots.txt"
            "site/sitemap.xml"
            "site/assets/icons/favicon.svg"
            "site/assets/icons/voidone-mark.svg"
            "site/css/variables.css"
            "site/css/core/base.css"
            "site/css/core/layout.css"
            "site/css/components/nav.css"
            "site/css/pages/home.css"
            "site/js/core/site.js"
            "site/js/api/github.js"
            "site/js/components/downloads.js"
            "site/js/components/ai.js"
            "site/data/evolution.json"
            "site/data/project.json"
            "site/data/features.json"
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required deployment file: $file"
              missing=1
            fi
          done
          (( missing == 0 )) || exit 1
          echo "Deployment boundary: OK (${#required[@]} required files)"

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zEq '(^|/)\.env($|\.)|(^|/)(id_rsa|id_ed25519)$'; then
            echo '::error::Potential secret or private-key file is tracked.'
            exit 1
          fi
          if git status --porcelain | grep -q .; then
            echo '::error::Checkout is not clean.'
            exit 1
          fi
          echo 'Repository hygiene: OK'

  validate:
    name: Validate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site/js src -type f -name '*.js' -print0)
          echo 'JavaScript syntax: OK'

      - name: JSON contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          data = Path('site/data')
          for name in ('evolution.json', 'project.json', 'features.json'):
              path = data / name
              if not path.is_file():
                  raise SystemExit(f'Missing data file: {path}')
              json.loads(path.read_text(encoding='utf-8'))
          project = json.loads((data / 'project.json').read_text(encoding='utf-8'))
          for key in ('name', 'tagline', 'description', 'status', 'license', 'repository', 'website'):
              if not str(project.get(key, '')).strip():
                  raise SystemExit(f'project.json missing {key}')
          evolution = json.loads((data / 'evolution.json').read_text(encoding='utf-8'))
          if not isinstance(evolution, list):
              raise SystemExit('evolution.json must be an array')
          features = json.loads((data / 'features.json').read_text(encoding='utf-8'))
          if not isinstance(features, list):
              raise SystemExit('features.json must be an array')
          print('JSON contracts: OK')

      - name: HTML and SEO contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/seo-contract.js
          echo 'HTML / SEO contracts: OK'

      - name: Internal reference validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          root = Path('site').resolve()
          html_pattern = re.compile(r'''\b(?:href|src)\s*=\s*["']([^"'#?]+)''', re.I)
          css_pattern = re.compile(r'''url\(\s*["']?([^"')?#]+)''', re.I)
          external_schemes = {'http', 'https', 'mailto', 'tel', 'data', 'blob', 'javascript'}
          failures = []
          checked = 0
          def resolve_reference(source: Path, reference: str):
              reference = reference.strip()
              if not reference or reference.startswith('//'):
                  return None
              parsed = urlsplit(reference)
              if parsed.scheme.lower() in external_schemes:
                  return None
              clean = parsed.path
              if not clean:
                  return None
              candidate = root / clean.lstrip('/') if clean.startswith('/') else source.parent / clean
              candidate = candidate.resolve()
              try:
                  candidate.relative_to(root)
              except ValueError:
                  return None
              return candidate
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              pattern = html_pattern if path.suffix.lower() == '.html' else css_pattern
              for reference in pattern.findall(text):
                  candidate = resolve_reference(path, reference)
                  if candidate is None:
                      continue
                  checked += 1
                  valid = candidate.is_file() or candidate.is_dir()
                  if not valid and not candidate.suffix:
                      valid = (candidate.with_suffix('.html')).is_file() or (candidate / 'index.html').is_file()
                  if not valid:
                      failures.append(f'{path.relative_to(root)} -> {reference} -> {candidate.relative_to(root)}')
          if failures:
              print('::error::Broken local references:')
              for failure in failures:
                  print(f'::error::{failure}')
              raise SystemExit(f'Internal reference validation failed: {len(failures)} broken references')
          print(f'Internal references: OK ({checked} local references checked)')
          PY

      - name: Wrangler configuration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "voidone-website"' "$WORKER_CONFIG"
          grep -q '"main": "./src/worker.js"' "$WORKER_CONFIG"
          grep -q '"directory": "./site"' "$WORKER_CONFIG"
          grep -q '"binding": "ASSETS"' "$WORKER_CONFIG"
          grep -q '"binding": "Voidone_al"' "$WORKER_CONFIG"
          grep -q '"run_worker_first": \["/download/\*", "/api/\*"\]' "$WORKER_CONFIG"
          grep -q '"preview_urls": false' "$WORKER_CONFIG"
          grep -q '"workers_dev": false' "$WORKER_CONFIG"
          if grep -Eq '"r2_buckets"|VOIDONE_DOWNLOADS|voidone-downloads' "$WORKER_CONFIG"; then
            echo '::error::Obsolete R2 configuration is still present.'
            exit 1
          fi
          echo 'Wrangler configuration: OK (Workers Assets + Workers AI + GitHub Releases)'

      - name: Download and AI layer contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "GITHUB_REPO = 'VoidOne-App/VoidOne'" src/worker.js
          grep -q 'GITHUB_RELEASES_URL' src/worker.js
          grep -q "provider: 'github-releases'" src/worker.js
          grep -q "name.endsWith('.msi') || name.endsWith('.exe')" src/worker.js
          grep -q "name.toLowerCase().endsWith('.zip')" src/worker.js
          grep -q "AI_MODEL = '@cf/zai-org/glm-4.7-flash'" src/worker.js
          grep -q 'env.Voidone_al.run' src/worker.js
          grep -q "AI_PREFIX = '/api/ai'" src/worker.js
          grep -q 'AI_MAX_INPUT_CHARS' src/worker.js
          grep -q 'AI_RATE_LIMIT' src/worker.js
          if grep -Eq 'VOIDONE_DOWNLOADS|DOWNLOAD_BUCKET_PREFIX' src/worker.js; then
            echo '::error::Worker still contains obsolete R2 download code.'
            exit 1
          fi
          echo 'Download + AI layer: OK (GitHub Releases + Workers AI)'

  dry_run:
    name: Cloudflare Dry Run
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- wrangler --version

      - name: Validate deployment with Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- \
            wrangler deploy --config "$WORKER_CONFIG" --dry-run
          echo 'Cloudflare deployment dry-run: OK'

  deploy:
    name: Production Deployment
    needs: dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify deployment credentials are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::CLOUDFLARE_API_TOKEN is not configured.'; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo '::error::CLOUDFLARE_ACCOUNT_ID is not configured.'; exit 1; }
          echo 'Cloudflare credentials: present'

      - name: Deploy production worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- \
            wrangler deploy --config "$WORKER_CONFIG"
          echo 'Production deployment: OK'

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloudflare Production Deployment'
            echo
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Wrangler:** ${WRANGLER_VERSION}"
            echo "- **Worker:** voidone-website"
            echo "- **Download backend:** GitHub Releases"
            echo "- **AI:** Workers AI / GLM-4.7-Flash"
            echo "- **Domain:** https://voidone.dpdns.org/"
          } >> "$GITHUB_STEP_SUMMARY"
