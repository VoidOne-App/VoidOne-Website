name: Deploy Website to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'
  WORKER_CONFIG: './wrangler.jsonc'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "${WORKER_CONFIG}" "src/worker.js" "site/index.html" "site/404.html"
            "site/downloads/index.html" "site/developers/index.html" "site/project/index.html" "site/explore/index.html" "site/system/index.html" "site/intelligence/index.html" "site/lab/index.html"
            "site/fa/index.html" "site/_headers" "site/robots.txt" "site/sitemap.xml"
            "site/assets/icons/favicon.svg" "site/assets/icons/voidone-mark.svg"
            "site/assets/images/voidone-player-world.svg" "site/assets/images/voidone-architecture.svg"
            "site/css/app.css" "site/js/app.js" "site/js/release.js" "site/js/evolution.js"
            "site/data/evolution.json"
          )
          for file in "${required[@]}"; do test -f "$file" || { echo "::error::Missing $file"; exit 1; }; done
          echo "Deployment boundary: OK"
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zEq '(^|/).env($|.)|(^|/)(id_rsa|id_ed25519)$'; then
            echo '::error::Potential secret or private key tracked.'
            exit 1
          fi

  validate:
    name: Validate
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find site/js src -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: JSON contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          for path in Path('site/data').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          evolution=json.loads(Path('site/data/evolution.json').read_text(encoding='utf-8'))
          assert isinstance(evolution,list), 'evolution.json must be an array'
          print('JSON contracts: OK')
      - name: HTML / SEO contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/seo-contract.js
      - name: Internal references
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          root=Path('site').resolve()
          pattern=re.compile(r'''\b(?:href|src)\s*=\s*["']([^"'#?]+)''',re.I)
          schemes={'http','https','mailto','tel','data','blob','javascript'}
          failures=[]
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower()!='.html': continue
              for ref in pattern.findall(path.read_text(encoding='utf-8')):
                  u=urlsplit(ref)
                  if u.scheme.lower() in schemes or ref.startswith('//'): continue
                  candidate=(root/u.path.lstrip('/') if u.path.startswith('/') else path.parent/u.path).resolve()
                  try: candidate.relative_to(root)
                  except ValueError: continue
                  if not (candidate.is_file() or candidate.is_dir() or candidate.with_suffix('.html').is_file() or (candidate/'index.html').is_file()):
                      failures.append(f'{path.relative_to(root)} -> {ref}')
          if failures:
              print(*failures,sep='\n')
              raise SystemExit('Broken internal references')
          print('Internal references: OK')
      - name: Worker contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"directory": "./site"' "$WORKER_CONFIG"
          grep -q '"binding": "ASSETS"' "$WORKER_CONFIG"
          grep -q '"binding": "AI"' "$WORKER_CONFIG"
          grep -q '"run_worker_first": \["/download/\*", "/api/\*"\]' "$WORKER_CONFIG"
          grep -q "AI_MODEL = '@cf/zai-org/glm-4.7-flash'" src/worker.js
          grep -q "AI_PREFIX = '/api/ai'" src/worker.js
          grep -q "GITHUB_REPO = 'VoidOne-App/VoidOne'" src/worker.js
          grep -q 'GITHUB_RELEASES_URL' src/worker.js
          echo 'Worker contracts: OK'

  dry_run:
    name: Cloudflare Dry Run
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install pinned Wrangler
        run: npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- wrangler --version
      - name: Validate deployment
        run: npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- wrangler deploy --config "$WORKER_CONFIG" --dry-run

  deploy:
    name: Production Deployment
    needs: dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec --yes --package="wrangler@${WRANGLER_VERSION}" -- wrangler deploy --config "$WORKER_CONFIG"
      - name: Summary
        if: always()
        run: |
          {
            echo '## VoidOne Website'
            echo
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Worker:** voidone-website"
            echo "- **Domain:** https://voidone.dpdns.org/"
            echo "- **Frontend architecture:** V5 Foundation"
            echo "- **Download backend:** GitHub Releases"
            echo "- **AI:** Cloudflare Workers AI"
          } >> "$GITHUB_STEP_SUMMARY"
