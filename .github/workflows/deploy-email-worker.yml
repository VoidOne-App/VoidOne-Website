name: Deploy VoidOne Email Worker

on:
  push:
    branches: [main]
    paths:
      - "email-worker/**"
      - ".github/workflows/deploy-email-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidone-email-worker-production
  cancel-in-progress: false

jobs:
  test:
    name: Test email gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run policy tests
        run: npm test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: email-worker/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Deploy Worker (creates it if needed)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: email-worker
          command: deploy --config wrangler.jsonc

  missing-cloudflare-secrets:
    name: Explain skipped deployment
    needs: test
    if: ${{ always() && needs.test.result == 'success' && (secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain setup
        run: |
          echo "Tests passed, but Cloudflare deployment was skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow again."
