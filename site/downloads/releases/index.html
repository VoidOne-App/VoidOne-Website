<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="VoidOne release history and channels."><title>Releases — VoidOne</title><link rel="stylesheet" href="../../css/app.css"></head><body><header class="site-header"><div class="nav shell"><a class="brand" href="../../">VOIDONE</a><nav class="nav-links"><a href="../">Download</a><a href="../../system/">System</a><a href="../../developers/">Developers</a></nav></div></header><main><section class="page-hero shell"><span class="eyebrow">DOWNLOAD / RELEASE HISTORY</span><h1 class="page-title">RELEASE<br><em>CONTROL.</em></h1><p>Published releases from the same API contract used by the download surface.</p><div class="actions"><a class="button" href="../">Latest ↗</a><a class="button" href="../verify/">Verify ↗</a></div></section><section class="section shell"><div class="feature-grid" id="releases"><article class="feature"><span class="index">LOADING</span><h3>Reading releases…</h3><p>Connecting to VoidOne Release API.</p></article></div></section></main><footer class="footer shell"><div class="brand">VOIDONE</div><div class="footer-links"><a href="../">Download</a><a href="../../">Home</a></div></footer><script>async function load(){const root=document.querySelector('#releases');try{const d=await fetch('/api/releases',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});const all=Object.values(d.channels).flat().sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));root.innerHTML=all.map((r,i)=>'<article class="feature"><span class="index">'+r.channel.toUpperCase()+' / '+String(i+1).padStart(2,'0')+'</span><h3>'+e(r.version)+'</h3><p>'+e(r.name)+' · '+new Date(r.published_at).toLocaleDateString()+'</p><div class="asset"><div><strong>'+r.assets.length+' assets</strong><small>'+r.assets.map(a=>e(a.filename)).join(' · ')+'</small></div><a class="status" href="'+e(r.notes_url)+'">NOTES ↗</a></div></article>').join('')||'<article class="feature"><h3>No published releases.</h3></article>'}catch(_){root.innerHTML='<article class="feature"><span class="index">DEGRADED</span><h3>Release API unavailable.</h3><p>Use GitHub as the direct source.</p><a class="status" href="https://github.com/VoidOne-App/VoidOne/releases">GITHUB ↗</a></article>'}}function e(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.addEventListener('DOMContentLoaded',load);</script></body></html>
